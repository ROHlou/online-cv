career-profile:
  title: Career Profile
  summary: |
    Undergraduate student in Electrical Engineering at POSTECH and research
    intern at CSDL. My interests lie in physical design and electronic
    design automation (EDA), with a focus on applying AI to optimize the
    synthesis and placement stages of the chip design flow.

education:
  title: Education
  info:
  - degree: B.S. in Electrical Engineering
    university: POSTECH (Pohang University of Science and Technology)
    time: 2020 - 2027.02 (Expected)
    details: |
      Relevant coursework:

        - VLSI Analysis & Design SW (EECE667)
        - Introduction to Electromagnetics (EECE261)
        - Circuit Theory, Electronic Circuits

experiences:
  title: Experiences
  info:
  - role: Undergraduate Research Intern
    time: Sep 2026 - Present
    company: CSDL, POSTECH # TODO: 연구실 정식 명칭(영문)과 지도교수명 추가 권장
    details: |
      Research on AI-driven EDA optimization for physical design.

        - Studied "Improving Timing & Power Trade-off in Post-place
          Optimization Using Multi-agent RL" (ICCAD 2024) and presented
          it in a poster session
        - Developing a research topic for NISICS, an undergraduate
          conference on next-generation semiconductors

  - role: Undergraduate Research Intern
